<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1422"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="M32 Builder"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>M32 Show File Builder</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0c1422;color:#edf6ff}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{padding:20px 16px;background:#14243a;position:sticky;top:0;z-index:5;border-bottom:1px solid #34516c}h1{font-size:20px;margin:0}header p{font-size:12px;color:#b5c8d9;margin:5px 0 0}nav{display:flex;gap:7px;overflow-x:auto;padding:12px 12px 3px;position:sticky;top:69px;background:#0c1422;z-index:4}button{border:1px solid #395570;border-radius:10px;background:#203850;color:#fff;padding:11px 12px;font-weight:600;cursor:pointer;white-space:nowrap}button.active,.primary{background:#077b93;border-color:#0cb5d3}main{padding:12px 14px 40px;max-width:920px;margin:auto}.panel{background:#172b42;border:1px solid #35506b;border-radius:14px;padding:13px;margin:10px 0}.item{border-top:1px solid #30455e;padding:12px 0}.item:first-child{border:0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:140px}.small{width:110px}.tiny{width:80px}label{display:block;font-size:12px;color:#b6cde0;margin-bottom:5px}input,select{background:#0c1d2f;color:#fff;border:1px solid #48647f;border-radius:8px;padding:11px 9px;width:100%;font-size:15px}input[type=checkbox]{width:18px;height:18px;accent-color:#2bc5d9}.check{display:flex;align-items:center;gap:8px;font-size:13px}.check label{margin:0}.hint{font-size:12px;color:#b4c7d9;line-height:1.55}.warn{color:#ffd69b}.sectiontitle{font-size:16px;font-weight:750;margin:8px 0 12px}.pill{background:#243e58;border-radius:8px;padding:6px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.bar{display:flex;gap:8px;align-items:center;margin:10px 0}.bar button{flex:1}.hidden{display:none}footer{padding:15px;color:#abc0d4;font-size:12px}#status{white-space:pre-wrap;font-size:13px;color:#a9f0c6;margin:10px 0}input:focus,select:focus{outline:2px solid #30b8ce}a{color:#8de3ff}@media(min-width:680px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><header><h1>🎚️ M32 Show File Builder V2.1.2</h1><p>32 Input · HPF · 16 Mix Bus · IEM Sends</p></header>
<nav id="tabs"></nav><main><div id="view"></div><div id="status" role="status"></div></main><footer>Generator berbasis template scene M32 yang sudah diuji pengguna. Selalu recall secara offline dan periksa output sebelum dipakai live.</footer>
<script>
const COLORS=['OFF','RD','GN','YE','BL','CY','MG','WH'],TAPS=[['IN/LC','Input / Low Cut · uji'],['<-EQ','Pre EQ · uji'],['EQ->','Post EQ · teruji'],['PRE','Pre Fader · uji'],['POST','Post Fader · teruji'],['GRP','Subgroup · uji']];
const tabs=[['channels','Channel'],['buses','Mix Bus'],['sends','CH → Bus'],['export','Ekspor']];
const mk=()=>({channels:Array.from({length:32},(_,i)=>({name:'',color:'WH',link:false,hpfOn:false,hpfHz:20})),buses:Array.from({length:16},(_,i)=>({name:i<12?`IEM ${Math.floor(i/2)+1} ${i%2?'R':'L'}`:'',color:'BL',link:i<12&&i%2===0,master:'-oo'})),matrices:Array.from({length:6},(_,i)=>({name:`MATRIX ${i+1}`,color:'MG',link:false,master:'-oo'})),sends:Array.from({length:32},()=>Array.from({length:16},()=>({level:'-oo',tap:'EQ->',on:true}))),matrixSends:Array.from({length:16},()=>Array.from({length:6},()=>({level:'-oo',on:false})))});
let state;try{state=JSON.parse(localStorage.getItem('m32state'))||mk();if(state.channels?.length!==32||state.sends?.length!==32)throw 1;}catch{state=mk()}
state.channels.forEach(c=>{if(c.hpfOn===undefined)c.hpfOn=false;if(c.hpfHz===undefined)c.hpfHz=20});
let tab='channels',chPage=0,busPage=0,sendPage=0,selectedBus=0,selectedMatrix=0,bulk='-30.0',bulkTap='EQ->';
const $=id=>document.getElementById(id),safe=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const save=()=>{try{localStorage.setItem('m32state',JSON.stringify(state))}catch(e){status('Penyimpanan lokal gagal: '+e.message)}};
function status(s){$('status').textContent=s}
function setval(group,i,key,value){state[group][i][key]=value;save()}
function options(values,current){return values.map(v=>{let a=Array.isArray(v)?v:[v,v];return `<option value="${safe(a[0])}" ${current===a[0]?'selected':''}>${safe(a[1])}</option>`}).join('')}
function inp(value,action,cls='grow',placeholder=''){return `<div class="${cls}"><input placeholder="${safe(placeholder)}" value="${safe(value)}" data-act="${action}"></div>`}
function sel(values,value,action,cls='small'){return `<div class="${cls}"><select data-act="${action}">${options(values,value)}</select></div>`}
function checkbox(checked,action,label){return `<div class="check"><input type="checkbox" ${checked?'checked':''} data-act="${action}"><label>${safe(label)}</label></div>`}
function pages(n,selected,kind){return `<div class="bar">${Array.from({length:n},(_,i)=>`<button class="${selected===i?'active':''}" data-nav="${kind}:${i}">${kind==='busPage'?`${i*8+1}–${i*8+8}`:`${i*8+1}–${i*8+8}`}</button>`).join('')}</div>`}
function render(){
$('tabs').innerHTML=tabs.map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${label}</button>`).join('');
let html='';
if(tab==='channels'){html='<div class="sectiontitle">Nama, warna, stereo link & HPF input</div>'+pages(4,chPage,'chPage');for(let i=chPage*8;i<chPage*8+8;i++){const c=state.channels[i];html+=`<div class="item"><div class="row"><b>CH ${String(i+1).padStart(2,'0')}</b>${inp(c.name,`channels:${i}:name`,'grow','Nama channel')}${sel(COLORS,c.color,`channels:${i}:color`)}</div>${i%2===0?checkbox(c.link,`channels:${i}:link`,`Stereo link ${i+1}–${i+2}`):''}<div class="row">${checkbox(c.hpfOn,`channels:${i}:hpfOn`,'HPF ON')}<div class="small"><label>HPF Hz (20–400)</label><input type="number" min="20" max="400" data-act="channels:${i}:hpfHz" value="${safe(c.hpfHz)}"></div></div></div>`}}
if(tab==='buses'){html='<div class="sectiontitle">Mix Bus 01–16</div>'+pages(2,busPage,'busPage');for(let i=busPage*8;i<busPage*8+8;i++){const b=state.buses[i];html+=`<div class="item"><div class="row"><b>BUS ${String(i+1).padStart(2,'0')}</b>${inp(b.name,`buses:${i}:name`,'grow','Nama mix bus')}${sel(COLORS,b.color,`buses:${i}:color`)}</div><div class="row">${i%2===0?checkbox(b.link,`buses:${i}:link`,`Stereo link ${i+1}–${i+2}`):''}<div class="small"><label>Master (dB)</label><input data-act="buses:${i}:master" value="${safe(b.master)}"></div></div></div>`}}
if(tab==='sends'){html=`<div class="sectiontitle">Send level & tap point tiap CH → tiap Bus</div><div class="panel"><label>Bus tujuan</label><select data-pick="selectedBus">${options(state.buses.map((b,i)=>[String(i),`Bus ${i+1} — ${b.name||'Unnamed'}`]),String(selectedBus))}</select><p class="hint">Tap point ditulis pada send Bus bernomor ganjil untuk pasangan 1–2, 3–4, dst. Pilihan bertanda 'uji' harus diverifikasi di M32-Edit. Stereo-linked Bus memakai level kedua sisi sama untuk tes awal.</p><div class="row"><div class="grow"><label>Level massal (dB)</label><input id="bulk" value="${safe(bulk)}"></div><div class="grow"><label>Tap point massal</label><select id="bulktap">${options(TAPS,bulkTap)}</select></div></div><button data-action="bulk">Terapkan ke 32 CH pada bus ini</button><div class="row"><div class="grow"><label>Salin seluruh mix dari Bus</label><select id="copyfrom">${options(state.buses.map((b,i)=>[String(i),`Bus ${i+1} — ${b.name}`]),'0')}</select></div><div class="grow"><label>Ke Bus tujuan</label><select id="copyto">${options(state.buses.map((b,i)=>[String(i),`Bus ${i+1} — ${b.name}`]),String(selectedBus))}</select></div></div><button data-action="copymix">Copy Mix (32 CH)</button></div>`+pages(4,sendPage,'sendPage');for(let i=sendPage*8;i<sendPage*8+8;i++){const s=state.sends[i][selectedBus];html+=`<div class="item"><b>CH ${i+1} — ${safe(state.channels[i].name||'Unnamed')}</b><div class="row"><div class="small"><label>Send dB</label><input data-act="send:${i}:${selectedBus}:level" value="${safe(s.level)}"></div><div class="grow"><label>Tap point</label><select data-act="send:${i}:${selectedBus}:tap">${options(TAPS,s.tap)}</select></div>${checkbox(s.on,`send:${i}:${selectedBus}:on`,'ON')}</div></div>`}}
if(tab==='matrices'){html='<div class="sectiontitle">Matrix 1–6</div><p class="hint">Nama, warna, master, dan link matrix dapat diekspor. Master tetap -∞ sebagai pengaturan awal aman.</p>';for(let i=0;i<6;i++){const m=state.matrices[i];html+=`<div class="item"><div class="row"><b>MTX ${i+1}</b>${inp(m.name,`matrices:${i}:name`,'grow','Nama matrix')}${sel(COLORS,m.color,`matrices:${i}:color`)}</div><div class="row">${i%2===0?checkbox(m.link,`matrices:${i}:link`,`Stereo link ${i+1}–${i+2}`):''}<div class="small"><label>Master dB</label><input data-act="matrices:${i}:master" value="${safe(m.master)}"></div></div></div>`}}
if(tab==='matrixsend'){html=`<div class="sectiontitle">Bus → Matrix</div><p class="hint warn">V2: send Bus → Matrix ditulis ke SCN menggunakan format dari template. Ini fitur eksperimental; uji recall dan level Matrix secara offline sebelum live.</p><label>Matrix tujuan</label><select data-pick="selectedMatrix">${options(state.matrices.map((m,i)=>[String(i),`Matrix ${i+1} — ${m.name}`]),String(selectedMatrix))}</select>`;for(let i=0;i<16;i++){const s=state.matrixSends[i][selectedMatrix];html+=`<div class="item"><b>Bus ${i+1} — ${safe(state.buses[i].name)}</b><div class="row"><div class="grow"><label>Level</label><input data-act="matrixsend:${i}:${selectedMatrix}:level" value="${safe(s.level)}"></div>${checkbox(s.on,`matrixsend:${i}:${selectedMatrix}:on`,'ON')}</div></div>`}}
if(tab==='export'){html=`<div class="sectiontitle">Simpan & Generate Scene</div><div class="panel"><p>Isian otomatis tersimpan di browser iPhone ini (localStorage). Kamu juga bisa menyimpan backup JSON.</p><div class="row"><button data-action="download-json">Backup JSON</button><button data-action="import-json">Import JSON</button><input class="hidden" id="jsonfile" type="file" accept=".json,application/json"></div></div><div class="panel"><b>Generate .scn</b><p class="hint">Menggunakan template terverifikasi Tahap 3. Routing fisik dipertahankan. Level master Bus/Matrix dibatasi -∞ saat ekspor demi keamanan.</p><button class="primary" data-action="generate">Generate & Download SCN</button><p class="hint warn">HPF dan tap point baru perlu pengujian M32-Edit. Bus → Matrix tidak diubah. Stereo link CH → Bus menolak perbedaan level/tap kiri-kanan.</p></div><button data-action="reset">Reset seluruh form</button>`}
$('view').innerHTML=html;
}
function normalizeLevel(v){const t=String(v).trim().toLowerCase();if(['-oo','-inf','-infinity'].includes(t))return '-oo';if(!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t))throw Error('Level tidak valid: '+v);const n=Number(t);if(n < -90||n > 10)throw Error('Level di luar rentang -90 hingga +10 dB: '+v);return n>0?'+'+n.toFixed(1):n.toFixed(1)}
function download(name,body,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);a.remove()}
function generate(template){
let lines=template.split(/\r?\n/),ix=new Map();lines.forEach((s,i)=>{if(s.startsWith('/')){const key=s.split(' ')[0];if(ix.has(key))throw Error('Key duplikat '+key);ix.set(key,i)}});
function get(k){if(!ix.has(k))throw Error('Template tidak memiliki '+k);return lines[ix.get(k)]}
function put(k,s){get(k);lines[ix.get(k)]=k+' '+s}
function name(s,label){s=String(s||'').trim();if(s.length>12||/["\r\n]/.test(s))throw Error(label+': nama maksimal 12 karakter tanpa tanda kutip');return s}
function config(k,n,c){const old=get(k).match(/^(\S+) "[^"]*" (\d+) (\S+) ?(\d+)?$/);if(!old)throw Error('Format config tidak dikenali '+k);put(k,`"${name(n,k)}" ${old[2]} ${c}${old[4]?' '+old[4]:''}`)}
function linked(path,items,count){const old=get(path).split(/\s+/).slice(1);if(old.length!==count)throw Error('Panjang link tidak cocok '+path);put(path,Array.from({length:count},(_,i)=>items[2*i].link?'ON':'OFF').join(' '))}
linked('/config/chlink',state.channels,16);linked('/config/buslink',state.buses,8);linked('/config/mtxlink',state.matrices,3);
for(let i=0;i<32;i++){const c=state.channels[i],n=String(i+1).padStart(2,'0');config(`/ch/${n}/config`,c.name,c.color);const key=`/ch/${n}/preamp`,old=get(key);const m=old.match(/^(\S+)\s+(\S+)\s+(ON|OFF)\s+(ON|OFF)\s+(\d+)\s+(\d+(?:\.\d+)?)$/);if(!m)throw Error('Format preamp tidak dikenali '+key);const hz=Number(c.hpfHz);if(!Number.isFinite(hz)||hz<20||hz>400)throw Error('HPF CH '+(i+1)+' harus 20–400 Hz');put(key,`${m[2]} ${m[3]} ${c.hpfOn?'ON':'OFF'} ${m[5]} ${hz}`)}
for(let i=0;i<16;i++){const b=state.buses[i];config(`/bus/${String(i+1).padStart(2,'0')}/config`,b.name,b.color);if(normalizeLevel(b.master)!=='-oo')throw Error('Untuk keamanan, master Bus '+(i+1)+' harus -oo');const key=`/bus/${String(i+1).padStart(2,'0')}/mix`,old=get(key);put(key,old.substring(key.length+1).replace(/^(ON|OFF)\s+\S+/, '$1   -oo'))}
for(let i=0;i<6;i++){const m=state.matrices[i];config(`/mtx/${String(i+1).padStart(2,'0')}/config`,m.name,m.color);if(normalizeLevel(m.master)!=='-oo')throw Error('Untuk keamanan, master Matrix '+(i+1)+' harus -oo');const key=`/mtx/${String(i+1).padStart(2,'0')}/mix`;put(key,'ON   -oo')}
for(let c=0;c<32;c++){for(let b=0;b<16;b++){const s=state.sends[c][b],linkedBus=b%2===1&&state.buses[b-1].link;let level=normalizeLevel(s.level),tap=s.tap,on=s.on;if(linkedBus){const left=state.sends[c][b-1];if(normalizeLevel(left.level)!==level||left.tap!==tap||left.on!==on)throw Error(`Stereo Bus ${b}–${b+1}, CH ${c+1}: level/tap/on kiri-kanan berbeda. Samakan di form.`)}if(!TAPS.some(x=>x[0]===tap))throw Error('Tap belum didukung: '+tap);const key=`/ch/${String(c+1).padStart(2,'0')}/mix/${String(b+1).padStart(2,'0')}`,old=get(key);if(b%2===0){const m=old.match(/^(\S+)\s+(ON|OFF)\s+(\S+)\s+(\S+)\s+(\S+)\s+(\S+)$/);if(!m)throw Error('Format send ganjil tidak dikenal: '+key);put(key,`${on?'ON':'OFF'}   ${level} ${m[4]} ${tap} ${m[6]}`)}else{if(!/^\S+\s+(ON|OFF)\s+\S+$/.test(old))throw Error('Format send genap tidak dikenal: '+key);put(key,`${on?'ON':'OFF'}   ${level}`)}}}
/* V2.1: Bus to Matrix sengaja tidak ditulis.
for(let b=0;b<16;b++){for(let m=0;m<6;m++){const v=state.matrixSends[b][m];const level=normalizeLevel(v.level);const key=`/bus/${String(b+1).padStart(2,'0')}/mix/${String(m+1).padStart(2,'0')}`;const old=get(key);if(m%2===0){const match=old.match(/^\S+\s+(ON|OFF)\s+(\S+)\s+(\S+)\s+(PRE|POST)\s+(\S+)$/);if(!match)throw Error('Format Matrix send ganjil tidak dikenali '+key);put(key,`${v.on?'ON':'OFF'}   ${level} ${match[3]} ${match[4]} ${match[5]}`)}else{if(!/^\S+\s+(ON|OFF)\s+\S+$/.test(old))throw Error('Format Matrix send genap tidak dikenali '+key);put(key,`${v.on?'ON':'OFF'}   ${level}`)}}}
*/
return lines.join('\n')}
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();return}if(t.dataset.nav){const [k,v]=t.dataset.nav.split(':');({chPage:v=>chPage=v,busPage:v=>busPage=v,sendPage:v=>sendPage=v})[k](Number(v));render();return}
try{if(t.dataset.action==='bulk'){bulk=$('bulk').value;bulkTap=$('bulktap').value;normalizeLevel(bulk);state.sends.forEach(row=>{row[selectedBus]={...row[selectedBus],level:bulk,tap:bulkTap}});save();render();status('Pengaturan massal diterapkan.')}
if(t.dataset.action==='copymix'){const from=Number($('copyfrom').value),to=Number($('copyto').value);if(from===to)throw Error('Bus sumber dan tujuan harus berbeda');state.sends.forEach(row=>row[to]={...row[from]});save();render();status('Mix 32 channel berhasil disalin dari Bus '+(from+1)+' ke Bus '+(to+1));}
if(t.dataset.action==='download-json'){download('M32_Builder_Backup.json',JSON.stringify(state,null,2),'application/json');status('Backup JSON dibuat.')}
if(t.dataset.action==='import-json')$('jsonfile').click();
if(t.dataset.action==='reset'&&confirm('Hapus semua isian dan kembali ke default?')){state=mk();save();render();status('Form direset.')}
if(t.dataset.action==='generate'){const res=await fetch('./template.scn');if(!res.ok)throw Error('template.scn tidak ditemukan');const output=generate(await res.text());download('M32_BUILDER_V2_1_1.scn',output,'application/octet-stream');status('File SCN berhasil dibuat. Uji recall secara offline di M32-Edit.')}}catch(err){status('ERROR: '+err.message)}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.pick){if(t.dataset.pick==='selectedBus')selectedBus=Number(t.value);else selectedMatrix=Number(t.value);render();return}if(t.id==='jsonfile'){try{const o=JSON.parse(await t.files[0].text());if(o.channels?.length!==32||o.buses?.length!==16||o.sends?.length!==32||o.matrices?.length!==6||o.matrixSends?.length!==16)throw Error('Struktur JSON tidak sesuai');state=o;save();render();status('Backup dipulihkan.')}catch(err){status('ERROR: '+err.message)}return}if(t.dataset.act){const [g,a,b,c]=t.dataset.act.split(':');const val=t.type==='checkbox'?t.checked:t.value;if(g==='send')state.sends[+a][+b][c]=val;else if(g==='matrixsend')state.matrixSends[+a][+b][c]=val;else state[g][+a][b]=val;save();}});
document.addEventListener('input',e=>{if(e.target.id==='bulk')bulk=e.target.value;if(e.target.id==='bulktap')bulkTap=e.target.value;if(e.target.dataset.act&&e.target.type!=='checkbox'&&e.target.tagName!=='SELECT'){const [g,a,b,c]=e.target.dataset.act.split(':');if(g==='send')state.sends[+a][+b][c]=e.target.value;else if(g==='matrixsend')state.matrixSends[+a][+b][c]=e.target.value;else state[g][+a][b]=e.target.value;save()}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
